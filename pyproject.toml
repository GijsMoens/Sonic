[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic"
version = "0.1.0"
description = "SONIC: Spectral Oriented Neural Invariant Convolutions"
readme = "README.md"
license = {text = "CC-BY-4.0"}
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy",
]

[project.optional-dependencies]
examples = [
    "torchvision",
    "matplotlib",
    "thop",
    "wandb",
]

[project.urls]
Paper = "https://arxiv.org/abs/2601.19884"

[tool.setuptools.packages.find]
where = ["src"]

